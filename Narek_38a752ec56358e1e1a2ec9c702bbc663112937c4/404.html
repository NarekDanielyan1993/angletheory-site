<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>404 — Page Not Found | Angle Theory Studio</title>

    <meta
      name="description"
      content="The page you're looking for doesn't exist."
    />
    <meta name="robots" content="noindex, follow" />

    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/404.css" />
  </head>

  <body>
    <main class="error-404">
      <div class="error-404__ambient error-404__ambient--top"></div>
      <div class="error-404__ambient error-404__ambient--bottom"></div>

      <section class="error-404__container">
        <div class="error-404__eyebrow">
          <span class="error-404__indicator"></span>
          PAGE NOT FOUND
        </div>

        <div class="error-404__visual" aria-hidden="true">
          <span class="error-404__digit">4</span>
          <span class="error-404__digit error-404__digit--accent">0</span>
          <span class="error-404__digit">4</span>
          <span class="error-404__visual-line"></span>
        </div>

        <div class="error-404__content">
          <h1>
            This page took<br />
            a wrong turn.
          </h1>

          <p class="error-404__description">
            The page you're looking for doesn't exist.
          </p>

          <div class="error-404__actions">
            <a class="error-404__home" href="http://localhost:8000/">
              <span>Back to homepage</span>
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M5 12h14M13 6l6 6-6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </div>

        <div class="error-404__footer">
          <span>ANGLE THEORY STUDIO</span>
          <span class="error-404__footer-line"></span>
          <span>Back to the right direction</span>
        </div>
      </section>
    </main>
  </body>
</html>
